<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Business</title>
  <style>
    :root {
      --bg: #f6f5f2; --card: #ffffff; --ink: #1f2328; --muted: #6a6f76; --line: #e3e1dc;
      --brand: #8a3b12; --brand-soft: #f6e7dd; --ok: #1f7a4d; --ok-soft: #e1f3e9;
      --warn: #9a6400; --warn-soft: #fbefd6; --bad: #b42318; --bad-soft: #fde7e5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
    header { position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
    header h1 { font-size: 17px; margin: 0; flex: 1; }
    header small { opacity: .8; font-size: 12px; }
    main { max-width: 760px; margin: 0 auto; padding: 16px 16px 96px; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 5; }
    nav button { flex: 1; border: 0; background: none; padding: 12px 4px 14px; font: inherit; font-size: 13px; color: var(--muted); cursor: pointer; }
    nav button.active { color: var(--brand); font-weight: 600; box-shadow: inset 0 3px 0 var(--brand); }
    h2 { font-size: 18px; margin: 4px 0 12px; }
    h3 { font-size: 15px; margin: 20px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
    .tap { cursor: pointer; }
    .tap:hover { border-color: var(--brand); }
    .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .muted { color: var(--muted); font-size: 13px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; background: var(--line); white-space: nowrap; }
    .pill.Booked, .pill.Completed { background: var(--ok-soft); color: var(--ok); }
    .pill.Enquiry, .pill.Visit, .pill.Tasting { background: var(--warn-soft); color: var(--warn); }
    .pill.Lost, .pill.Cancelled { background: var(--bad-soft); color: var(--bad); }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
    textarea { min-height: 70px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .btn { display: inline-block; border: 0; border-radius: 8px; padding: 11px 16px; font: inherit; font-weight: 600; cursor: pointer; background: var(--brand); color: #fff; text-decoration: none; text-align: center; }
    .btn.secondary { background: var(--brand-soft); color: var(--brand); }
    .btn.wa { background: #1f7a4d; }
    .btn.block { display: block; width: 100%; margin-top: 16px; }
    .btn[disabled] { opacity: .6; cursor: wait; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .notice { padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 14px; }
    .notice.ok { background: var(--ok-soft); color: var(--ok); }
    .notice.warn { background: var(--warn-soft); color: var(--warn); }
    .notice.bad { background: var(--bad-soft); color: var(--bad); }
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .filters input { grid-column: 1 / -1; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; font-size: 14px; vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    .slot { display: inline-block; min-width: 92px; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .slot.free { background: var(--ok-soft); color: var(--ok); }
    .slot.taken { background: var(--bad-soft); color: var(--bad); }
    .slot.interest { background: var(--warn-soft); color: var(--warn); }
    .seg { display: flex; gap: 6px; margin-bottom: 12px; }
    .seg button { flex: 1; }
    .demo { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 13px; padding: 6px 16px; }
    .empty { color: var(--muted); text-align: center; padding: 24px 8px; }
    #toast { position: fixed; left: 16px; right: 16px; bottom: 76px; max-width: 520px; margin: 0 auto; z-index: 10; display: none; }
    @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>Event Business</h1>
    <small id="who"></small>
    <button class="btn secondary" style="padding:6px 10px" onclick="reload()">Refresh</button>
  </header>
  <div id="demo" class="demo" hidden>Demo mode: data is saved only in this browser. Deploy with Google Apps Script to share it with the team.</div>
  <main id="view"><div class="empty">Loading...</div></main>
  <div id="toast" class="notice"></div>
  <nav>
    <button data-tab="home" onclick="go('home')">Home</button>
    <button data-tab="add" onclick="go('add')">+ New</button>
    <button data-tab="records" onclick="go('records')">Records</button>
    <button data-tab="availability" onclick="go('availability')">Availability</button>
  </nav>

<script>
/* ------------------------------------------------------------------ server calls */

var DEMO = !(window.google && google.script && google.script.run);

function call(fn, arg) {
  if (DEMO) return DemoServer.call(fn, arg);
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) {
      reject(new Error(e && e.message ? e.message : String(e)));
    })[fn](arg);
  });
}

/* ------------------------------------------------------------------ state */

var S = { data: null, tab: 'home', filters: { q: '', status: 'Active', hall: '' }, avail: { mode: 'date', date: '', hall: '', month: '' } };

function reload() {
  return call('apiBootstrap').then(function (d) {
    S.data = d;
    document.getElementById('who').textContent = d.user;
    if (!S.avail.date) S.avail.date = d.today;
    if (!S.avail.month) S.avail.month = d.today.slice(0, 7);
    render();
  }).catch(showError);
}

function go(tab, arg) {
  S.tab = tab; S.arg = arg;
  render();
  window.scrollTo(0, 0);
}

function render() {
  if (!S.data) return;
  document.querySelectorAll('nav button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === S.tab || (S.tab === 'edit' && b.dataset.tab === 'add') || (S.tab === 'detail' && b.dataset.tab === 'records'));
  });
  var v = document.getElementById('view');
  ({ home: renderHome, add: renderForm, edit: renderForm, records: renderRecords, detail: renderDetail, availability: renderAvailability })[S.tab](v);
}

/* ------------------------------------------------------------------ helpers */

function esc(s) {
  return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(n) { return n === '' || n === undefined || n === null ? '-' : 'Rs ' + Number(n).toLocaleString('en-IN'); }
function fmtDate(d) {
  if (!d) return '-';
  var p = d.split('-');
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][Number(p[1]) - 1];
  return Number(p[2]) + ' ' + m + ' ' + p[0];
}
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function pillClass(s) { return s.split(' ')[0]; }
function pill(s) { return '<span class="pill ' + esc(pillClass(s)) + '">' + esc(s) + '</span>'; }
function opts(list, sel, blank) {
  return (blank !== undefined ? '<option value="">' + esc(blank) + '</option>' : '') +
    list.map(function (o) { return '<option' + (o === sel ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('');
}
function isBlocking(r) { return S.data.lists.blockingStatuses.indexOf(r.status) !== -1; }
function isOpen(r) { return S.data.lists.openStatuses.indexOf(r.status) !== -1; }
function paymentsFor(id) { return S.data.payments.filter(function (p) { return p.recordId === id; }); }
function paidFor(id) { return paymentsFor(id).reduce(function (t, p) { return t + Number(p.amount || 0); }, 0); }
function balanceFor(r) { return r.totalAmount === '' ? '' : Number(r.totalAmount) - paidFor(r.id); }
function byId(id) { return S.data.records.filter(function (r) { return r.id === id; })[0]; }

function toast(msg, kind) {
  var t = document.getElementById('toast');
  t.className = 'notice ' + (kind || 'ok');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.style.display = 'none'; }, kind === 'bad' ? 7000 : 3000);
}
function showError(e) { toast(e.message || String(e), 'bad'); }

function recordCard(r, extra) {
  return '<div class="card tap" onclick="go(\'detail\',\'' + esc(r.id) + '\')">' +
    '<div class="row"><b>' + esc(r.customerName) + '</b>' + pill(r.status) + '</div>' +
    '<div class="muted">' + esc([r.eventType, r.hall, r.slot].filter(Boolean).join(' | ')) + '</div>' +
    '<div class="row muted"><span>' + fmtDate(r.eventDate) + (r.guests ? ' | ' + esc(r.guests) + ' guests' : '') + '</span><span>' + esc(r.id) + '</span></div>' +
    (extra || '') + '</div>';
}

/* ------------------------------------------------------------------ home */

function renderHome(v) {
  var d = S.data, today = d.today, week = addDays(today, 7), month = today.slice(0, 7);
  var open = d.records.filter(isOpen);
  var due = open.filter(function (r) { return r.followUpDate && r.followUpDate <= today; })
    .sort(function (a, b) { return a.followUpDate < b.followUpDate ? -1 : 1; });
  var upcoming = d.records.filter(function (r) { return r.status === 'Booked' && r.eventDate >= today && r.eventDate <= addDays(today, 14); })
    .sort(function (a, b) { return a.eventDate < b.eventDate ? -1 : 1; });
  var bookedThisMonth = d.records.filter(function (r) { return isBlocking(r) && String(r.eventDate).slice(0, 7) === month; }).length;
  var pending = d.records.filter(function (r) { return r.status === 'Booked'; })
    .reduce(function (t, r) { var b = balanceFor(r); return t + (b > 0 ? b : 0); }, 0);

  v.innerHTML = '<h2>Today, ' + fmtDate(today) + '</h2>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + open.length + '</b><span>Open enquiries</span></div>' +
      '<div class="stat"><b>' + upcoming.filter(function (r) { return r.eventDate <= week; }).length + '</b><span>Events next 7 days</span></div>' +
      '<div class="stat"><b>' + bookedThisMonth + '</b><span>Events booked this month</span></div>' +
      '<div class="stat"><b>' + money(pending) + '</b><span>Balance to collect</span></div>' +
    '</div>' +
    '<h3>Follow-ups due (' + due.length + ')</h3>' +
    (due.length ? due.map(function (r) { return recordCard(r, '<div class="muted">Follow up by ' + fmtDate(r.followUpDate) + '</div>'); }).join('') : '<div class="empty">No follow-ups due.</div>') +
    '<h3>Upcoming events, next 14 days (' + upcoming.length + ')</h3>' +
    (upcoming.length ? upcoming.map(function (r) {
      var b = balanceFor(r);
      return recordCard(r, b > 0 ? '<div class="muted" style="color:var(--bad)">Balance due ' + money(b) + '</div>' : '');
    }).join('') : '<div class="empty">No events in the next 14 days.</div>');
}

/* ------------------------------------------------------------------ add / edit form */

function renderForm(v) {
  var d = S.data, L = d.lists;
  var r = S.tab === 'edit' ? byId(S.arg) : { status: 'Enquiry', eventType: 'Shaadi', source: 'Word of mouth', followUpDate: addDays(d.today, 3) };
  if (!r) return go('records');
  var halls = d.halls.map(function (h) { return h.name; });
  if (r.hall && halls.indexOf(r.hall) === -1) halls.push(r.hall);

  v.innerHTML = '<h2>' + (r.id ? 'Edit ' + esc(r.id) : 'New enquiry or booking') + '</h2>' +
    '<form id="f" class="card" onsubmit="return saveForm(event)">' +
      '<label>Status</label><select name="status" onchange="formChanged()">' + opts(L.statuses, r.status) + '</select>' +
      '<label>Customer name *</label><input name="customerName" required value="' + esc(r.customerName) + '">' +
      '<label>Phone *</label><input name="phone" type="tel" inputmode="numeric" required placeholder="10 digit mobile" value="' + esc(r.phone) + '">' +
      '<label>Address</label><input name="address" value="' + esc(r.address) + '">' +
      '<div class="grid2">' +
        '<div><label>Event type</label><select name="eventType">' + opts(L.eventTypes, r.eventType, '-') + '</select></div>' +
        '<div><label>Source</label><select name="source">' + opts(L.sources, r.source, '-') + '</select></div>' +
        '<div><label>Event date</label><input name="eventDate" type="date" value="' + esc(r.eventDate) + '" onchange="formChanged()"></div>' +
        '<div><label>Slot</label><select name="slot" onchange="formChanged()">' + opts(L.slots, r.slot, '-') + '</select></div>' +
      '</div>' +
      '<label>Hall</label><select name="hall" onchange="formChanged()">' + opts(halls, r.hall, '-') + '</select>' +
      '<div id="availMsg"></div>' +
      '<div class="grid2">' +
        '<div><label>Guests</label><input name="guests" type="number" min="0" inputmode="numeric" value="' + esc(r.guests) + '" oninput="calcTotal()"></div>' +
        '<div><label>Rate per plate (Rs)</label><input name="ratePerPlate" type="number" min="0" inputmode="numeric" value="' + esc(r.ratePerPlate) + '" oninput="calcTotal()"></div>' +
      '</div>' +
      '<label>Total amount (Rs)</label><input name="totalAmount" type="number" min="0" inputmode="numeric" value="' + esc(r.totalAmount) + '">' +
      '<div id="followWrap"><label>Next follow-up</label><input name="followUpDate" type="date" value="' + esc(r.followUpDate) + '"></div>' +
      '<div id="lostWrap"><label>Why was the customer lost? *</label><input name="lostReason" placeholder="Price, date not free, chose another venue..." value="' + esc(r.lostReason) + '"></div>' +
      '<label>Notes</label><textarea name="notes" placeholder="Menu ideas, special requests, tasting date...">' + esc(r.notes) + '</textarea>' +
      '<button class="btn block" id="saveBtn">' + (r.id ? 'Save changes' : 'Save') + '</button>' +
      (r.id ? '<button type="button" class="btn secondary block" onclick="go(\'detail\',\'' + esc(r.id) + '\')">Cancel</button>' : '') +
    '</form>';
  formChanged();
}

function formVals() {
  var f = document.getElementById('f'), o = {};
  Array.prototype.forEach.call(f.elements, function (el) { if (el.name) o[el.name] = el.value.trim(); });
  return o;
}

function calcTotal() {
  var f = document.getElementById('f');
  var g = Number(f.guests.value), rate = Number(f.ratePerPlate.value);
  if (g && rate) f.totalAmount.value = g * rate;
}

function formChanged() {
  var o = formVals(), L = S.data.lists;
  document.getElementById('lostWrap').hidden = o.status !== 'Lost';
  document.getElementById('followWrap').hidden = L.openStatuses.indexOf(o.status) === -1;
  var box = document.getElementById('availMsg');
  if (!o.hall || !o.eventDate || !o.slot) { box.innerHTML = ''; return; }
  var selfId = S.tab === 'edit' ? S.arg : '';
  var same = S.data.records.filter(function (r) { return r.id !== selfId && r.hall === o.hall && r.eventDate === o.eventDate && r.slot === o.slot; });
  var taken = same.filter(isBlocking)[0];
  var interest = same.filter(isOpen);
  if (taken) box.innerHTML = '<div class="notice bad">Not available: booked for ' + esc(taken.customerName) + ' (' + esc(taken.id) + ').</div>';
  else box.innerHTML = '<div class="notice ok">' + esc(o.hall) + ' is free on ' + fmtDate(o.eventDate) + ' (' + esc(o.slot) + ').' +
    (interest.length ? ' ' + interest.length + ' other open enquir' + (interest.length > 1 ? 'ies' : 'y') + ' for this slot.' : '') + '</div>';
}

function saveForm(e) {
  e.preventDefault();
  var o = formVals();
  if (S.tab === 'edit') { var cur = byId(S.arg); o.id = cur.id; o.updatedAt = cur.updatedAt; }
  var btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  call('apiSaveRecord', o).then(function (saved) {
    toast('Saved ' + saved.id);
    return reload().then(function () { go('detail', saved.id); });
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = 'Save';
    showError(err);
  });
  return false;
}

/* ------------------------------------------------------------------ records list */

function renderRecords(v) {
  var d = S.data, F = S.filters;
  var statusChoices = ['Active', 'All'].concat(d.lists.statuses);
  v.innerHTML = '<h2>Records</h2>' +
    '<div class="filters">' +
      '<input id="q" placeholder="Search name, phone or ID" value="' + esc(F.q) + '" oninput="S.filters.q=this.value;drawList()">' +
      '<select onchange="S.filters.status=this.value;drawList()">' + opts(statusChoices, F.status) + '</select>' +
      '<select onchange="S.filters.hall=this.value;drawList()">' + opts(d.halls.map(function (h) { return h.name; }), F.hall, 'All halls') + '</select>' +
    '</div><div id="list"></div>';
  drawList();
}

function drawList() {
  var F = S.filters, q = F.q.toLowerCase();
  var list = S.data.records.filter(function (r) {
    if (F.status === 'Active' && !(isOpen(r) || r.status === 'Booked')) return false;
    if (F.status !== 'Active' && F.status !== 'All' && r.status !== F.status) return false;
    if (F.hall && r.hall !== F.hall) return false;
    if (q && (r.customerName + ' ' + r.phone + ' ' + r.id).toLowerCase().indexOf(q) === -1) return false;
    return true;
  }).sort(function (a, b) { return (a.eventDate || '9999') < (b.eventDate || '9999') ? -1 : 1; });
  document.getElementById('list').innerHTML = '<div class="muted" style="margin-bottom:8px">' + list.length + ' record(s)</div>' +
    (list.length ? list.map(function (r) { return recordCard(r); }).join('') : '<div class="empty">Nothing found.</div>');
}

/* ------------------------------------------------------------------ record detail + payments */

function renderDetail(v) {
  var r = byId(S.arg);
  if (!r) return go('records');
  var pays = paymentsFor(r.id), paid = paidFor(r.id), bal = balanceFor(r);
  var rows = [
    ['Phone', esc(r.phone)], ['Address', esc(r.address)], ['Event', esc(r.eventType)],
    ['Date', fmtDate(r.eventDate) + (r.slot ? ' (' + esc(r.slot) + ')' : '')], ['Hall', esc(r.hall)],
    ['Guests', esc(r.guests)], ['Rate per plate', money(r.ratePerPlate)], ['Total', money(r.totalAmount)],
    ['Paid', money(paid)], ['Balance', money(bal)], ['Source', esc(r.source)]
  ];
  if (isOpen(r)) rows.push(['Next follow-up', fmtDate(r.followUpDate)]);
  if (r.lostReason) rows.push(['Lost reason', esc(r.lostReason)]);
  if (r.notes) rows.push(['Notes', esc(r.notes).replace(/\n/g, '<br>')]);

  v.innerHTML =
    '<div class="row"><h2>' + esc(r.customerName) + '</h2>' + pill(r.status) + '</div>' +
    '<div class="muted">' + esc(r.id) + ' | added by ' + esc(r.createdBy) + ' | last change by ' + esc(r.updatedBy) + '</div>' +
    '<div class="card" style="margin-top:10px"><table>' + rows.map(function (x) { return '<tr><th>' + x[0] + '</th><td>' + (x[1] || '-') + '</td></tr>'; }).join('') + '</table>' +
      '<div class="actions"><button class="btn secondary" onclick="go(\'edit\',\'' + esc(r.id) + '\')">Edit</button></div></div>' +
    '<h3>Send on WhatsApp</h3><div class="actions">' + waButtons(r, paid, bal) + '</div>' +
    '<h3>Payments (' + pays.length + ')</h3>' +
    (pays.length ? '<div class="card"><table><tr><th>Date</th><th>Amount</th><th>Mode</th><th>Ref</th></tr>' + pays.map(function (p) {
      return '<tr><td>' + fmtDate(p.date) + '</td><td>' + money(p.amount) + '</td><td>' + esc(p.mode) + '</td><td>' + esc(p.reference) + '</td></tr>';
    }).join('') + '</table></div>' : '<div class="empty">No payments yet.</div>') +
    '<form id="pf" class="card" onsubmit="return savePayment(event)">' +
      '<b>Record a payment</b>' +
      '<div class="grid2">' +
        '<div><label>Amount (Rs) *</label><input name="amount" type="number" min="1" inputmode="numeric" required></div>' +
        '<div><label>Mode *</label><select name="mode" required>' + opts(S.data.lists.paymentModes, '', '-') + '</select></div>' +
        '<div><label>Date</label><input name="date" type="date" value="' + S.data.today + '"></div>' +
        '<div><label>Reference / UPI ID</label><input name="reference"></div>' +
      '</div>' +
      '<button class="btn block" id="payBtn">Save payment</button>' +
    '</form>';
}

function waLink(phone, text) {
  var p = String(phone).replace(/\D/g, '');
  if (p.length === 10) p = '91' + p;
  return 'https://wa.me/' + p + '?text=' + encodeURIComponent(text);
}

function waButtons(r, paid, bal) {
  var when = fmtDate(r.eventDate) + (r.slot ? ' (' + r.slot + ')' : '');
  var msgs = [];
  if (isOpen(r)) msgs.push(['Thank you for enquiry',
    'Namaste ' + r.customerName + ' ji,\nThank you for your enquiry' + (r.eventType ? ' for your ' + r.eventType : '') +
    (r.hall ? ' at ' + r.hall : '') + '. We would be happy to host you. Please let us know a convenient time to visit the hall and for food tasting.']);
  if (isBlocking(r)) msgs.push(['Booking confirmation',
    'Namaste ' + r.customerName + ' ji,\nYour booking is confirmed.\nBooking ID: ' + r.id + '\nEvent: ' + (r.eventType || '-') +
    '\nHall: ' + r.hall + '\nDate: ' + when + '\nGuests: ' + r.guests + '\nTotal: ' + money(r.totalAmount) +
    '\nPaid: ' + money(paid) + '\nBalance: ' + money(bal) + '\nThank you!']);
  if (paid > 0) msgs.push(['Payment receipt',
    'Namaste ' + r.customerName + ' ji,\nWe have received ' + money(paid) + ' in total for booking ' + r.id + ' (' + when + ').' +
    (bal !== '' ? '\nBalance remaining: ' + money(bal) : '') + '\nThank you!']);
  if (r.status === 'Booked' && bal > 0) msgs.push(['Balance reminder',
    'Namaste ' + r.customerName + ' ji,\nA gentle reminder that ' + money(bal) + ' is pending for your event on ' + when + ' at ' + r.hall + '. Thank you!']);
  if (r.status === 'Completed') msgs.push(['Thank you after event',
    'Namaste ' + r.customerName + ' ji,\nThank you for celebrating with us at ' + r.hall + '. We hope you and your guests enjoyed it. A short review on Google would mean a lot to us!']);
  return msgs.map(function (m) { return '<a class="btn wa" target="_blank" rel="noopener" href="' + esc(waLink(r.phone, m[1])) + '">' + esc(m[0]) + '</a>'; }).join('') ||
    '<span class="muted">No messages for this status.</span>';
}

function savePayment(e) {
  e.preventDefault();
  var f = document.getElementById('pf');
  var p = { recordId: S.arg, amount: f.amount.value, mode: f.mode.value, date: f.date.value, reference: f.reference.value.trim() };
  var btn = document.getElementById('payBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  call('apiAddPayment', p).then(function () {
    toast('Payment saved');
    return reload();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = 'Save payment';
    showError(err);
  });
  return false;
}

/* ------------------------------------------------------------------ availability */

function slotCell(hall, date, slot) {
  var same = S.data.records.filter(function (r) { return r.hall === hall && r.eventDate === date && r.slot === slot; });
  var taken = same.filter(isBlocking)[0];
  if (taken) return '<span class="slot taken tap" onclick="go(\'detail\',\'' + esc(taken.id) + '\')">' + esc(slot) + ': ' + esc(taken.customerName) + '</span>';
  var interest = same.filter(isOpen).length;
  if (interest) return '<span class="slot interest">' + esc(slot) + ': free, ' + interest + ' enq.</span>';
  return '<span class="slot free">' + esc(slot) + ': free</span>';
}

function renderAvailability(v) {
  var A = S.avail, d = S.data;
  if (!A.hall && d.halls.length) A.hall = d.halls[0].name;
  var html = '<h2>Availability</h2><div class="seg">' +
    '<button class="btn ' + (A.mode === 'date' ? '' : 'secondary') + '" onclick="S.avail.mode=\'date\';render()">One date, all halls</button>' +
    '<button class="btn ' + (A.mode === 'month' ? '' : 'secondary') + '" onclick="S.avail.mode=\'month\';render()">One hall, full month</button></div>';
  if (A.mode === 'date') {
    html += '<input type="date" value="' + esc(A.date) + '" onchange="S.avail.date=this.value;render()">' +
      '<div class="card" style="margin-top:10px"><table><tr><th>Hall</th><th>Slots on ' + fmtDate(A.date) + '</th></tr>' +
      d.halls.map(function (h) {
        return '<tr><td>' + esc(h.name) + '</td><td>' + d.lists.slots.map(function (s) { return slotCell(h.name, A.date, s); }).join('<br>') + '</td></tr>';
      }).join('') + '</table></div>';
  } else {
    var parts = A.month.split('-'), days = new Date(Date.UTC(Number(parts[0]), Number(parts[1]), 0)).getUTCDate();
    var rows = '';
    for (var i = 1; i <= days; i++) {
      var date = A.month + '-' + ('0' + i).slice(-2);
      var dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(date + 'T00:00:00Z').getUTCDay()];
      rows += '<tr><td>' + i + ' ' + dow + '</td><td>' + d.lists.slots.map(function (s) { return slotCell(A.hall, date, s); }).join(' ') + '</td></tr>';
    }
    html += '<div class="grid2"><select onchange="S.avail.hall=this.value;render()">' + opts(d.halls.map(function (h) { return h.name; }), A.hall) + '</select>' +
      '<input type="month" value="' + esc(A.month) + '" onchange="S.avail.month=this.value||S.avail.month;render()"></div>' +
      '<div class="card" style="margin-top:10px"><table>' + rows + '</table></div>';
  }
  v.innerHTML = html;
}

/* ------------------------------------------------------------------ demo mode (opened outside Google) */

var DemoServer = (function () {
  var KEY = 'eventbusiness-demo-v1';
  var LISTS = {
    statuses: ['Enquiry', 'Visit Scheduled', 'Tasting Scheduled', 'Booked', 'Completed', 'Cancelled', 'Lost'],
    openStatuses: ['Enquiry', 'Visit Scheduled', 'Tasting Scheduled'],
    blockingStatuses: ['Booked', 'Completed'],
    eventTypes: ['Shaadi', 'Reception', 'Engagement', 'Other'],
    slots: ['Morning', 'Evening'],
    sources: ['Word of mouth', 'Google', 'Walk-in', 'Repeat customer', 'Other'],
    paymentModes: ['Cash', 'UPI', 'Bank transfer', 'Cheque', 'Online link']
  };
  var HALLS = ['Mahavir Banquet', 'Nirmala Hall', 'Vrindavan Vatika', 'C.H. Hall', 'Barfiwala Hall', 'M.M. Public School']
    .map(function (n) { return { name: n, capacity: '', active: 'Yes' }; });

  function today() { var d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
  function load() {
    var db = null;
    try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    return db || { records: [], payments: [] };
  }
  function store(db) { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
  function nextId(prefix, rows) {
    var max = rows.reduce(function (m, r) { var n = parseInt(String(r.id).replace(prefix, ''), 10); return n > m ? n : m; }, 0);
    return prefix + ('0000' + (max + 1)).slice(-4);
  }

  var api = {
    apiBootstrap: function () {
      var db = load();
      return { user: 'demo@local', today: today(), lists: LISTS, halls: HALLS, records: db.records, payments: db.payments };
    },
    apiSaveRecord: function (o) {
      var db = load(), now = new Date().toISOString();
      if (!o.customerName) throw new Error('Customer name is required.');
      o.phone = String(o.phone || '').replace(/[^\d+]/g, '');
      if (!/^\+?\d{10,13}$/.test(o.phone)) throw new Error('Phone number should have 10 digits.');
      if (LISTS.blockingStatuses.indexOf(o.status) !== -1) {
        if (!o.hall || !o.eventDate || !o.slot || !o.guests) throw new Error('Hall, date, slot and guests are required for a booking.');
        var clash = db.records.filter(function (r) {
          return r.id !== o.id && LISTS.blockingStatuses.indexOf(r.status) !== -1 && r.hall === o.hall && r.eventDate === o.eventDate && r.slot === o.slot;
        })[0];
        if (clash) throw new Error(o.hall + ' is already booked on ' + o.eventDate + ' (' + o.slot + ') for ' + clash.customerName + ' [' + clash.id + '].');
      }
      if (o.status === 'Lost' && !o.lostReason) throw new Error('Please note why the customer was lost.');
      ['guests', 'ratePerPlate', 'totalAmount'].forEach(function (k) { o[k] = o[k] === '' || o[k] === undefined ? '' : Number(o[k]); });
      if (LISTS.openStatuses.indexOf(o.status) === -1) o.followUpDate = '';
      o.updatedAt = now; o.updatedBy = 'demo@local';
      if (o.id) {
        var i = db.records.findIndex(function (r) { return r.id === o.id; });
        db.records[i] = Object.assign({}, db.records[i], o);
        o = db.records[i];
      } else {
        o.id = nextId('EB-', db.records); o.createdAt = now; o.createdBy = 'demo@local';
        db.records.push(o);
      }
      store(db);
      return o;
    },
    apiAddPayment: function (p) {
      var db = load();
      if (!(Number(p.amount) > 0)) throw new Error('Enter an amount greater than zero.');
      if (!p.mode) throw new Error('Choose a payment mode.');
      p.id = nextId('PAY-', db.payments); p.amount = Number(p.amount); p.date = p.date || today();
      p.recordedBy = 'demo@local'; p.recordedAt = new Date().toISOString();
      db.payments.push(p);
      store(db);
      return p;
    }
  };
  return {
    call: function (fn, arg) {
      return new Promise(function (resolve, reject) {
        try { resolve(JSON.parse(JSON.stringify(api[fn](arg)))); } catch (e) { reject(e); }
      });
    }
  };
})();

if (DEMO) document.getElementById('demo').hidden = false;
reload().then(function () { go('home'); });
</script>
