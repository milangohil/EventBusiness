<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7a1f2b">
  <title>Event Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f4ef; --surface: #ffffff; --surface-2: #f3eee7; --ink: #1c1917; --ink-2: #44403c; --muted: #78716c;
      --line: #e9e3da; --line-2: #d9d0c4;
      --brand: #7a1f2b; --brand-ink: #ffffff; --brand-soft: #f6e8ea; --brand-hover: #8f2735;
      --gold: #b7791f; --gold-soft: #fbf1df;
      --ok: #15803d; --ok-soft: #e4f4e9; --warn: #b45309; --warn-soft: #fdf1de; --bad: #b91c1c; --bad-soft: #fde9e9;
      --info: #4338ca; --info-soft: #ebebfc; --violet: #7e22ce; --violet-soft: #f3e8fd; --slate: #475569; --slate-soft: #edf0f4;
      --shadow-sm: 0 1px 2px rgba(28, 25, 23, .05);
      --shadow: 0 1px 2px rgba(28, 25, 23, .05), 0 6px 20px rgba(28, 25, 23, .06);
      --shadow-lg: 0 12px 40px rgba(28, 25, 23, .18);
      --r: 16px; --r-sm: 11px;
      --font: "Plus Jakarta Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --display: "Fraunces", "Noto Sans Devanagari", Georgia, "Times New Roman", serif;
      --tabbar-h: 66px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12100e; --surface: #1c1916; --surface-2: #26221e; --ink: #f5f0ea; --ink-2: #d9d1c7; --muted: #a59b90;
        --line: #2e2924; --line-2: #3e3731;
        --brand: #e58591; --brand-ink: #2a0d12; --brand-soft: #3a1e23; --brand-hover: #f0a0aa;
        --gold: #e5b55f; --gold-soft: #3a2d17;
        --ok: #5fd88d; --ok-soft: #173223; --warn: #f5b84a; --warn-soft: #3b2c12; --bad: #f88b8b; --bad-soft: #3e1c1c;
        --info: #aab6ff; --info-soft: #23264a; --violet: #d6b2fd; --violet-soft: #34214b; --slate: #cbd5e1; --slate-soft: #272d36;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4); --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .6);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: inherit; }
    svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    svg.i.sm { width: 16px; height: 16px; }
    svg.i.lg { width: 24px; height: 24px; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

    /* ---------- shell ---------- */
    .app { display: flex; min-height: 100vh; }
    .sidebar { display: none; }
    .main { flex: 1; min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      background: var(--bg); background: color-mix(in srgb, var(--bg) 86%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
    .topbar.scrolled { border-bottom-color: var(--line); }
    .topbar h1 { margin: 0; flex: 1; min-width: 0; font: 600 21px/1.2 var(--display); letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
    @media (max-width: 520px) { .topbar .sync { display: none; } }
    .content { max-width: 1120px; margin: 0 auto; padding: 4px 16px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom)); }
    .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
      height: calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--surface); border-top: 1px solid var(--line); }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; }
    .tab.active { color: var(--brand); }
    .tab .fab { width: 52px; height: 52px; margin-top: -26px; border-radius: 18px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); box-shadow: 0 8px 20px color-mix(in srgb, var(--brand) 40%, transparent); }
    .tab .fab svg { width: 26px; height: 26px; }

    @media (min-width: 960px) {
      .sidebar { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; width: 252px; flex: none; padding: 22px 14px; background: var(--surface); border-right: 1px solid var(--line); }
      .tabbar { display: none; }
      .topbar { padding: 20px 36px 14px; }
      .content { padding: 4px 36px 56px; }
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 4px 10px 22px; }
    .brand-mark { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font: 600 17px var(--display); }
    .brand b { display: block; font: 600 17px/1.2 var(--display); }
    .brand span { font-size: 12px; color: var(--muted); }
    .side-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 11px; border: 0; background: none; color: var(--ink-2); font-weight: 600; font-size: 14px; cursor: pointer; text-align: left; }
    .side-link:hover { background: var(--surface-2); }
    .side-link.active { background: var(--brand-soft); color: var(--brand); }
    .side-new { margin: 0 0 14px; }
    .side-foot { margin-top: auto; padding: 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); word-break: break-all; }

    /* ---------- building blocks ---------- */
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }
    .card-pad { padding: 16px; }
    .card + .card, .card + .section, .section + .card { margin-top: 14px; }
    .section { margin-top: 24px; }
    .section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 2px 10px; }
    .section-h h2 { margin: 0; font: 600 17px/1.3 var(--display); }
    .section-h .count { color: var(--muted); font-weight: 500; font-family: var(--font); font-size: 14px; }
    .link { border: 0; background: none; color: var(--brand); font-weight: 600; font-size: 13px; cursor: pointer; padding: 4px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
    .grid-2 { display: grid; gap: 14px; }
    .grid-2 > *, .cal-layout > * { min-width: 0; }
    @media (min-width: 960px) { .grid-2 { grid-template-columns: 1.15fr 1fr; align-items: start; } .grid-2 > .section, .grid-2 > div > .section:first-child { margin-top: 0; } }
    .spacer { flex: 1; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 12px; border: 1px solid transparent;
      font-weight: 650; font-size: 14.5px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, transform .05s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--brand); color: var(--brand-ink); }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-secondary { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
    .btn-secondary:hover { background: var(--surface-2); }
    .btn-soft { background: var(--brand-soft); color: var(--brand); }
    .btn-ok { background: var(--ok); color: #fff; }
    .btn-danger { background: var(--bad-soft); color: var(--bad); }
    .btn-wa { background: #1f8f4e; color: #fff; }
    .btn-block { width: 100%; }
    .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
    .btn-icon { width: 42px; min-height: 42px; padding: 0; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; display: inline-grid; place-items: center; }
    .btn[disabled], .btn.busy { opacity: .65; pointer-events: none; }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* status pills */
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 650; white-space: nowrap; background: var(--slate-soft); color: var(--slate); }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .st-enquiry { background: var(--warn-soft); color: var(--warn); }
    .st-visit { background: var(--info-soft); color: var(--info); }
    .st-tasting { background: var(--violet-soft); color: var(--violet); }
    .st-booked { background: var(--ok-soft); color: var(--ok); }
    .st-completed { background: var(--slate-soft); color: var(--slate); }
    .st-cancelled { background: var(--slate-soft); color: var(--muted); }
    .st-lost { background: var(--bad-soft); color: var(--bad); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700; }
    .tag-bad { background: var(--bad-soft); color: var(--bad); }
    .tag-warn { background: var(--warn-soft); color: var(--warn); }
    .tag-ok { background: var(--ok-soft); color: var(--ok); }

    /* KPIs */
    .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    @media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); gap: 14px; } }
    .kpi { padding: 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
    .kpi:hover { border-color: var(--line-2); }
    .kpi .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
    .kpi b { font: 600 24px/1.1 var(--display); letter-spacing: -.01em; }
    .kpi span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
    .ic-brand { background: var(--brand-soft); color: var(--brand); }
    .ic-ok { background: var(--ok-soft); color: var(--ok); }
    .ic-warn { background: var(--warn-soft); color: var(--warn); }
    .ic-info { background: var(--info-soft); color: var(--info); }
    .ic-gold { background: var(--gold-soft); color: var(--gold); }

    .hello { margin: 4px 2px 16px; }
    .hello h2 { margin: 0; font: 600 26px/1.2 var(--display); letter-spacing: -.015em; }
    .hello p { margin: 4px 0 0; color: var(--muted); }

    /* list rows */
    .list { overflow: hidden; }
    .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; text-decoration: none; color: inherit; }
    .row:first-child { border-top: 0; }
    .row:hover { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
    .row .body { flex: 1; min-width: 0; }
    .row .title { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .meta { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row .end { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; text-align: right; }
    .row .amt { font-weight: 700; font-size: 14px; }
    .row .chev { color: var(--line-2); }
    .dt { width: 48px; flex: none; border-radius: 12px; text-align: center; padding: 6px 0 7px; background: var(--surface-2); line-height: 1.05; }
    .dt b { display: block; font: 600 19px/1.1 var(--display); }
    .dt span { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    .dt.booked { background: var(--ok-soft); } .dt.booked span, .dt.booked b { color: var(--ok); }
    .dt.open { background: var(--warn-soft); } .dt.open span, .dt.open b { color: var(--warn); }
    .dt.closed { opacity: .7; }
    .dt.nodate b { font-size: 15px; padding: 4px 0; }
    .avatar { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; }
    .group-h { padding: 18px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }

    .empty { padding: 30px 18px; text-align: center; color: var(--muted); }
    .empty .ic { width: 52px; height: 52px; margin: 0 auto 10px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
    .empty b { display: block; color: var(--ink); font-weight: 650; margin-bottom: 2px; }
    .empty .btn { margin-top: 14px; }

    /* chips & segmented */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
    .chips.scroll::-webkit-scrollbar { display: none; }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
    .chip:hover { border-color: var(--muted); }
    .chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .chip .n { font-size: 12px; opacity: .7; font-weight: 600; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 13px; background: var(--surface-2); }
    .seg button { min-height: 40px; border: 0; border-radius: 10px; background: none; font-weight: 650; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

    /* forms */
    .form-sec { padding: 16px; }
    .form-sec + .form-sec { border-top: 1px solid var(--line); }
    .form-sec h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
    .field { margin-top: 14px; }
    .field > label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 6px; }
    .req { color: var(--brand); }
    .input { width: 100%; min-height: 46px; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); font-size: 16px; transition: border-color .15s, box-shadow .15s; }
    .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    textarea.input { min-height: 84px; resize: vertical; }
    .input-wrap { display: flex; align-items: stretch; }
    .input-wrap .pre { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--line-2); border-right: 0; border-radius: 12px 0 0 12px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
    .input-wrap .input { border-radius: 0 12px 12px 0; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .has-err .input { border-color: var(--bad); }
    .err { color: var(--bad); font-size: 12.5px; font-weight: 600; margin-top: 6px; }
    .err:empty { display: none; }
    .hall-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .hall { text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; min-height: 58px; }
    .hall b { display: block; font-size: 14px; font-weight: 650; line-height: 1.25; }
    .hall small { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 3px; }
    .hall small::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
    .hall.free small { color: var(--ok); } .hall.free small::before { background: var(--ok); }
    .hall.interest small { color: var(--warn); } .hall.interest small::before { background: var(--warn); }
    .hall.taken small { color: var(--bad); } .hall.taken small::before { background: var(--bad); }
    .hall.taken { background: var(--surface-2); }
    .hall.on { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: var(--brand-soft); }
    .calc { margin-top: 8px; padding: 10px 12px; border-radius: 11px; background: var(--surface-2); font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; }
    .calc b { font-size: 15px; }
    .savebar { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 10px); z-index: 10; margin-top: 16px; display: flex; gap: 10px; padding: 10px; border-radius: 18px; background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .savebar .btn-primary { flex: 1; }
    @media (min-width: 960px) { .savebar { bottom: 16px; } .form-wrap { max-width: 760px; } }

    /* detail */
    .hero { padding: 18px; }
    .hero-top { display: flex; gap: 14px; align-items: flex-start; }
    .hero-top .dt { width: 60px; padding: 8px 0 9px; }
    .hero-top .dt b { font-size: 24px; }
    .hero h2 { margin: 0 0 4px; font: 600 23px/1.2 var(--display); letter-spacing: -.01em; word-break: break-word; }
    .facts { display: grid; gap: 9px; margin-top: 16px; }
    .fact { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14.5px; }
    .fact svg { color: var(--muted); }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .actions .btn { flex-direction: column; gap: 4px; min-height: 62px; font-size: 12.5px; padding: 8px; }
    .steps { display: flex; align-items: center; gap: 4px; margin: 4px 0 14px; }
    .step { flex: 1; text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); }
    .step i { display: block; height: 5px; border-radius: 99px; background: var(--line); margin-bottom: 6px; }
    .step.done i { background: var(--ok); } .step.done { color: var(--ok); }
    .step.cur i { background: var(--brand); } .step.cur { color: var(--brand); }
    .banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-size: 14px; }
    .banner svg { margin-top: 1px; }
    .banner-bad { background: var(--bad-soft); color: var(--bad); }
    .banner-warn { background: var(--warn-soft); color: var(--warn); }
    .banner-ok { background: var(--ok-soft); color: var(--ok); }
    .banner-info { background: var(--info-soft); color: var(--info); }
    .next-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .money-big { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
    .money-big b { font: 600 26px/1.1 var(--display); }
    .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 12px 0 10px; }
    .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--ok), color-mix(in srgb, var(--ok) 70%, #fff)); }
    .split { display: flex; justify-content: space-between; font-size: 13.5px; }
    .kv { display: grid; grid-template-columns: 120px 1fr; gap: 10px 12px; font-size: 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; word-break: break-word; }
    .msg-row .avatar { background: #e3f5ea; color: #1f8f4e; }
    @media (prefers-color-scheme: dark) { .msg-row .avatar { background: #173223; color: #5fd88d; } }

    /* calendar */
    .cal-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 10px; }
    .cal-head h3 { margin: 0; flex: 1; font: 600 19px var(--display); }
    .cal { padding: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0 6px; letter-spacing: .04em; }
    .day { position: relative; aspect-ratio: 1 / 1.08; min-height: 44px; border: 0; border-radius: 11px; background: none; cursor: pointer; padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; color: var(--ink); }
    .day:hover { background: var(--surface-2); }
    .day .num { font-size: 14px; font-weight: 650; }
    .day.past .num { color: var(--muted); }
    .day.today .num { color: var(--brand); }
    .day.today::after { content: ""; position: absolute; top: 3px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
    .day.sel { background: var(--ink); color: var(--bg); }
    .day.sel .num { color: var(--bg); }

  listen: fn => window.addEventListener('hashchange', () => { if (S._skipHash === location.hash) { S._skipHash = null; return; } fn(parseHash(location.hash)); })
};
Hist.listen(r => { S.route = r; enterView(); render(); window.scrollTo(0, 0); });

function go(view, id, opts) {
  opts = opts || {};
  closeSheet();
  S.route = { view, id: id || '', from: opts.from || null };
  enterView();
  Hist.push(S.route);
  render();
  window.scrollTo(0, 0);
}
function back() {
  const r = S.route;
  if (r.from) return go(r.from.view, r.from.id);
  if (r.view === 'form' && r.id) return go('detail', r.id);
  if ((r.view === 'menu' || r.view === 'sheet') && r.id) return go('detail', r.id);
  if (r.view === 'dish') return go('kitchen');
  go(r.view === 'detail' ? 'bookings' : 'home');
}

/* =================================================================== helpers */

function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const INR = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
function money(n) { return n === '' || n === undefined || n === null || isNaN(Number(n)) ? '-' : INR.format(Number(n)); }
function moneyShort(n) {
  n = Number(n) || 0;
  const a = Math.abs(n);
  if (a >= 1e7) return '₹' + +(n / 1e7).toFixed(2) + ' Cr';
  if (a >= 1e5) return '₹' + +(n / 1e5).toFixed(2) + ' L';
  if (a >= 1e3) return '₹' + +(n / 1e3).toFixed(1) + 'K';
  return '₹' + n;
}
function d(iso) { return new Date(iso + 'T00:00:00Z'); }
function fmt(iso, o) { return iso ? d(iso).toLocaleDateString('en-IN', Object.assign({ timeZone: 'UTC' }, o)) : ''; }
function fmtLong(iso) { return iso ? fmt(iso, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : 'Date not set'; }
function fmtMed(iso) { return iso ? fmt(iso, { weekday: 'short', day: 'numeric', month: 'short' }) : 'No date'; }
function addDays(iso, n) { const x = d(iso); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function diffDays(iso) { return Math.round((d(iso) - d(S.data.today)) / 864e5); }
function rel(iso) {
  if (!iso) return '';
  const n = diffDays(iso);
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  if (n > 1 && n < 60) return 'in ' + n + ' days';
  if (n < -1 && n > -60) return -n + ' days ago';
  return fmt(iso, { month: 'short', year: 'numeric' });
}
function monthLabel(ym) { return fmt(ym + '-01', { month: 'long', year: 'numeric' }); }
function initials(name) { return String(name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }

function isOpen(r) { return STATUS[r.status] && STATUS[r.status].group === 'open'; }
function isBlocking(r) { return r.status === 'Booked' || r.status === 'Completed'; }
function paymentsFor(id) { return S.data.payments.filter(p => p.recordId === id); }
function paidFor(id) { return paymentsFor(id).reduce((t, p) => t + Number(p.amount || 0), 0); }
function balanceFor(r) { return r.totalAmount === '' || r.totalAmount === undefined ? null : Number(r.totalAmount) - paidFor(r.id); }
function byId(id) { return S.data.records.find(r => r.id === id); }
function halls() { return S.data.halls.map(h => h.name); }
function hallCap(name) { const h = S.data.halls.find(x => x.name === name); return h && Number(h.capacity) > 0 ? Number(h.capacity) : 0; }
function pill(status) { return '<span class="pill ' + ((STATUS[status] || {}).cls || '') + '">' + esc(status) + '</span>'; }
function dateTile(r) {
  const g = STATUS[r.status] ? STATUS[r.status].group : '';
  if (!r.eventDate) return '<div class="dt nodate ' + g + '"><b>?</b><span>date</span></div>';
  return '<div class="dt ' + g + '"><b>' + fmt(r.eventDate, { day: 'numeric' }) + '</b><span>' + fmt(r.eventDate, { month: 'short' }) + '</span></div>';
}
function cleanPhone(p) { return String(p || '').replace(/[^\d+]/g, ''); }
function waNumber(p) { let x = String(p || '').replace(/\D/g, ''); if (x.length === 10) x = '91' + x; return x; }
function waLink(phone, text) { return 'https://wa.me/' + waNumber(phone) + (text ? '?text=' + encodeURIComponent(text) : ''); }
function telLink(phone) { const x = waNumber(phone); return 'tel:+' + x; }

/* =================================================================== toast & sheet */

function toast(msg, o) {
  o = o || {};
  const root = $('#toast-root');
  const action = o.href ? '<a href="' + esc(o.href) + '" target="_blank" rel="noopener">' + esc(o.action) + '</a>' : '';
  root.innerHTML = '<div class="toast ' + (o.bad ? 'bad' : '') + '" role="status">' + icon(o.bad ? 'alert' : 'check') + '<span class="t-msg">' + esc(msg) + '</span>' + action + '</div>';
  clearTimeout(root._t);
  root._t = setTimeout(() => { root.innerHTML = ''; }, o.bad ? 7000 : (o.href ? 8000 : 3200));
}
function openSheet(html) {
  const tr = $('#toast-root'); clearTimeout(tr._t); tr.innerHTML = '';
  const root = $('#sheet');
  root.innerHTML = '<div class="backdrop" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + html + '</div>';
  root.classList.add('open');
  const f = root.querySelector('[autofocus]');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet() { const root = $('#sheet'); root.classList.remove('open'); root.innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn._html = btn.innerHTML; btn.classList.add('busy'); btn.innerHTML = icon('refresh', 'sm spin') + (label || 'Saving'); }
  else if (btn._html !== undefined) { btn.classList.remove('busy'); btn.innerHTML = btn._html; }
}
async function mutate(fn, arg, btn) {
  busy(btn, true);
  try {
    const res = await call(fn, arg);
    await reload(true);
    return res;
  } catch (e) {
    busy(btn, false);
    toast(e.message, { bad: true });
    throw e;
  }
}

/* =================================================================== shell */

const NAV = [

];
const TITLES = { home: 'Home', bookings: 'Bookings', calendar: 'Calendar', payments: 'Payments', kitchen: 'Kitchen', menu: 'Menu', sheet: 'Kitchen sheet' };

function navActive(view) {
  const v = S.route.view;
  if (v === 'detail' || (v === 'form' && S.route.id)) return view === 'bookings';

  $('#tabbar').innerHTML = t(NAV[0]) + t(NAV[1]) +
    '<button class="tab ' + (S.route.view === 'form' && !S.route.id ? 'active' : '') + '" data-act="new" aria-label="New enquiry"><span class="fab">' + icon('plus') + '</span></button>' +
    t(NAV[2]) + t(NAV[3]);
}
function renderTopbar() {
  const v = S.route.view;

  if (v === 'detail') trail = '<button class="btn-icon" data-act="edit" data-id="' + esc(S.route.id) + '" aria-label="Edit">' + icon('edit') + '</button>';
  const syncTxt = S.syncing ? 'Syncing' : (S.lastLoad ? 'Updated ' + new Date(S.lastLoad).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : '');
  if (v === 'home') trail += '<button class="btn-icon mobile-only" data-act="nav" data-view="payments" aria-label="Payments">' + icon('wallet') + '</button>';
  if (EDIT_VIEWS.indexOf(v) === -1) trail += '<span class="sync">' + syncTxt + '</span><button class="btn-icon" data-act="refresh" aria-label="Refresh">' + icon('refresh', S.syncing ? 'spin' : '') + '</button>';
  $('#topbar').innerHTML = lead + '<h1>' + esc(title) + '</h1>' + trail;
}
window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });

function render() {

  const v = $('#view');

function demoBar() {

function showFatal(e) {

}
function emptyState(ic, title, text, btn) {

/* =================================================================== row renderers */

function recordRow(r, endHtml) {
  const meta = [r.hall, r.slot, r.guests ? r.guests + ' guests' : '', r.eventType].filter(Boolean).join(' · ') || cleanPhone(r.phone);
  return '<button class="row" data-act="open" data-id="' + esc(r.id) + '">' + dateTile(r) +
    '<div class="body"><div class="title">' + esc(r.customerName) + '</div><div class="meta">' + esc(meta) + '</div></div>' +
    '<div class="end">' + (endHtml !== undefined ? endHtml : pill(r.status)) + '</div></button>';
}
function balanceTag(r) {
  const b = balanceFor(r);
  if (b === null) return '';
  if (b <= 0) return '<span class="tag tag-ok">Paid</span>';
  return '<span class="amt" style="color:var(--bad)">' + moneyShort(b) + ' due</span>';
}

/* =================================================================== home */

function viewHome() {
  const D = S.data, today = D.today, recs = D.records;
  const hour = new Date().getHours();
  const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const open = recs.filter(isOpen);
  const week = recs.filter(r => r.status === 'Booked' && r.eventDate >= today && r.eventDate <= addDays(today, 6));
  const month = recs.filter(r => isBlocking(r) && String(r.eventDate).slice(0, 7) === today.slice(0, 7));
  const due = recs.filter(isBlocking).reduce((t, r) => { const b = balanceFor(r); return t + (b > 0 ? b : 0); }, 0);

  const kpi = (ic, cls, val, label, view) => '<button class="kpi" data-act="nav" data-view="' + view + '"><span class="ic ' + cls + '">' + icon(ic) + '</span><b>' + val + '</b><span>' + label + '</span></button>';

  // needs attention
  const items = [];
  open.filter(r => r.followUpDate && r.followUpDate <= today).forEach(r => {
    const n = diffDays(r.followUpDate);
    items.push({ sort: n, html: recordRow(r, (n < 0 ? '<span class="tag tag-bad">' + (-n) + 'd overdue</span>' : '<span class="tag tag-warn">Call today</span>')), r, why: 'Follow up' });
  });
  recs.filter(r => r.status === 'Booked' && r.eventDate >= today && r.eventDate <= addDays(today, 15) && balanceFor(r) > 0).forEach(r => {
    items.push({ sort: diffDays(r.eventDate) + 0.5, html: recordRow(r, '<span class="amt" style="color:var(--bad)">' + moneyShort(balanceFor(r)) + '</span><span class="small muted">' + rel(r.eventDate) + '</span>') });
  });
  recs.filter(r => r.status === 'Booked' && r.eventDate && r.eventDate < today).forEach(r => {
    items.push({ sort: 100, html: recordRow(r, '<span class="tag tag-warn">Mark done?</span>') });
  });
  recs.filter(r => r.status === 'Booked' && r.eventDate >= today && r.eventDate <= addDays(today, 14)).forEach(r => {
    const st = kitchenStatus(r), n = diffDays(r.eventDate);
    if (st.key === 'ready' || (n > 6 && st.key !== 'nomenu')) return;
    items.push({ sort: n + 0.3, html: recordRow(r, '<span class="tag tag-' + (n <= 6 ? 'bad' : 'warn') + '">Kitchen: ' + esc(st.label) + '</span><span class="small muted">' + rel(r.eventDate) + '</span>') });
  });
  items.sort((a, b) => a.sort - b.sort);

  // agenda
  const upcoming = recs.filter(r => isBlocking(r) && r.eventDate >= today && r.eventDate <= addDays(today, 14))
    .sort((a, b) => (a.eventDate + a.slot).localeCompare(b.eventDate + b.slot));
  const byDate = {};
  upcoming.forEach(r => { (byDate[r.eventDate] = byDate[r.eventDate] || []).push(r); });
  const agenda = Object.keys(byDate).map(dt =>
    '<div class="group-h"><span>' + fmtMed(dt) + '</span><span>' + rel(dt) + '</span></div><div class="card list">' +
    byDate[dt].map(r => recordRow(r, balanceTag(r) || pill(r.status))).join('') + '</div>').join('');

  const showAll = S.ui.attnAll;
  const attnHtml = items.length
    ? '<div class="card list">' + items.slice(0, showAll ? 99 : 5).map(i => i.html).join('') + '</div>' +
      (items.length > 5 ? '<div style="text-align:center;margin-top:6px"><button class="link" data-act="attn-toggle">' + (showAll ? 'Show less' : 'Show all ' + items.length) + '</button></div>' : '')
    : '<div class="card">' + emptyState('check', 'All caught up', 'No follow-ups or payments need attention.') + '</div>';

  return '<div class="hello"><h2>' + hello + '</h2><p>' + fmtLong(today) + '</p></div>' +
    '<div class="kpis">' +
      kpi('inbox', 'ic-warn', open.length, 'Open enquiries', 'bookings') +
      kpi('party', 'ic-ok', week.length, 'Events this week', 'calendar') +
      kpi('calendar', 'ic-info', month.length, 'Events this month', 'calendar') +
      kpi('rupee', 'ic-brand', moneyShort(due), 'Balance to collect', 'payments') +
    '</div>' +
    '<div class="grid-2" style="margin-top:24px"><div class="section" style="margin-top:0"><div class="section-h"><h2>Needs attention <span class="count">' + items.length + '</span></h2></div>' + attnHtml + '</div>' +
    '<div class="section" style="margin-top:0"><div class="section-h"><h2>Coming up</h2><span class="muted small">Next 14 days</span></div>' +
      (agenda || '<div class="card">' + emptyState('calendar', 'No events in the next 14 days', '', '<button class="btn btn-soft btn-sm" data-act="nav" data-view="calendar">Open calendar</button>') + '</div>') +
    '</div></div>';
}

/* =================================================================== bookings */

const BK_TABS = [
  { key: 'active', label: 'Active', test: (r, t) => isOpen(r) || (r.status === 'Booked' && (!r.eventDate || r.eventDate >= t) ) },
  { key: 'enquiries', label: 'Enquiries', test: r => isOpen(r) },
  { key: 'booked', label: 'Booked', test: r => r.status === 'Booked' },
  { key: 'done', label: 'Completed', test: r => r.status === 'Completed' },
  { key: 'closed', label: 'Lost & cancelled', test: r => r.status === 'Lost' || r.status === 'Cancelled' },
  { key: 'all', label: 'All', test: () => true }
];
function viewBookings() {
  const U = S.ui;
  const hallOpts = '<option value="">All halls</option>' + halls().map(h => '<option' + (h === U.hall ? ' selected' : '') + '>' + esc(h) + '</option>').join('');
  return '<div class="toolbar"><label class="search">' + icon('search') + '<input class="input" id="bk-q" type="search" placeholder="Search name, phone, ID" value="' + esc(U.q) + '" autocomplete="off"></label>' +
    '<select class="input" id="bk-hall" aria-label="Filter by hall">' + hallOpts + '</select></div>' +
    '<div class="chips scroll" id="bk-tabs">' + bkTabs() + '</div>' +
    '<div id="bk-list">' + bkList() + '</div>';
}
function bkBase() {
  const U = S.ui, q = U.q.trim().toLowerCase();
  return S.data.records.filter(r => (!U.hall || r.hall === U.hall) &&
    (!q || (r.customerName + ' ' + r.phone + ' ' + r.id + ' ' + r.hall).toLowerCase().indexOf(q) !== -1));
}
function bkTabs() {
  const base = bkBase(), t = S.data.today;
  return BK_TABS.map(x => '<button class="chip ' + (S.ui.bkTab === x.key ? 'on' : '') + '" data-act="bk-tab" data-key="' + x.key + '">' + x.label + ' <span class="n">' + base.filter(r => x.test(r, t)).length + '</span></button>').join('');
}
function bkList() {
  const t = S.data.today, tab = BK_TABS.find(x => x.key === S.ui.bkTab) || BK_TABS[0];
  const desc = tab.key === 'done' || tab.key === 'closed' || tab.key === 'all';
  const list = bkBase().filter(r => tab.test(r, t)).sort((a, b) => {
    const x = (a.eventDate || (desc ? '0000' : '9999')) + a.slot, y = (b.eventDate || (desc ? '0000' : '9999')) + b.slot;
    return desc ? y.localeCompare(x) : x.localeCompare(y);
  });
  if (!list.length) {
    return '<div class="card" style="margin-top:12px">' + emptyState('inbox', S.ui.q ? 'No matches' : 'Nothing here yet', S.ui.q ? 'Try a different name or number.' : 'New enquiries and bookings will appear here.',
      '<button class="btn btn-primary btn-sm" data-act="new">' + icon('plus', 'sm') + 'New enquiry</button>') + '</div>';
  }
  const groups = {};
  list.forEach(r => { const k = r.eventDate ? r.eventDate.slice(0, 7) : 'none'; (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups);
  return keys.map(k => '<div class="group-h"><span>' + (k === 'none' ? 'Date not set' : monthLabel(k)) + '</span><span>' + groups[k].length + '</span></div>' +
    '<div class="card list">' + groups[k].map(r => {
      let end = pill(r.status);
      if (r.status === 'Booked') { const b = balanceTag(r); if (b) end += b; }
      else if (isOpen(r) && r.followUpDate && r.followUpDate <= t) end += '<span class="tag tag-warn">Follow up</span>';
      return recordRow(r, end);
    }).join('') + '</div>').join('');
}

/* =================================================================== form */

    S.form.id = r.id; S.form.updatedAt = r.updatedAt;
    S.form._totalTouched = r.totalAmount !== '' && Number(r.totalAmount) !== Number(r.guests) * Number(r.ratePerPlate);
  } else {
    S.form = { status: 'Enquiry', customerName: '', phone: '', address: '', eventType: 'Shaadi', eventDate: '', slot: '', hall: '', guests: '',
      source: 'Word of mouth', ratePerPlate: '', totalAmount: '', followUpDate: addDays(D.today, 3), lostReason: '', notes: '', _totalTouched: false };
  }
  if (S.prefill) { Object.assign(S.form, S.prefill); S.prefill = null; }

function viewForm() {
  if (!S.form) return '<div class="card">' + emptyState('alert', 'Record not found', 'It may have been removed. Please refresh.') + '</div>';
  const F = S.form, L = S.data.lists, editing = !!F.id;
  const statuses = editing ? L.statuses : ['Enquiry', 'Visit Scheduled', 'Tasting Scheduled', 'Booked'];
  const inp = (k, attrs) => '<input class="input" data-field="' + k + '" value="' + esc(F[k]) + '" ' + (attrs || '') + '>';
  return '<div class="form-wrap"><div class="card">' +
    '<div class="form-sec"><h3>' + icon('spark', 'sm') + 'Stage</h3><div class="chips" id="cg-status" style="margin-top:10px">' + chipGroup('status', statuses) + '</div><div id="f-stage-extra"></div></div>' +

function segSlot() {
  return S.data.lists.slots.map(s => '<button type="button" class="' + (S.form.slot === s ? 'on' : '') + '" data-act="set" data-field="slot" data-value="' + s + '">' + icon(s === 'Morning' ? 'sun' : 'moon', 'sm') + s + '</button>').join('');
}
function afterFormRender() {
  if (!S.form) return;
  refreshForm();
  const f = $('#view [autofocus]');
  if (f && window.innerWidth >= 700) f.focus();
}
function refreshForm(which) {
  const F = S.form;
  if (!which || which === 'status') {
    $('#cg-status').innerHTML = chipGroup('status', S.form.id ? S.data.lists.statuses : ['Enquiry', 'Visit Scheduled', 'Tasting Scheduled', 'Booked']);
    let extra = '';
    if (isOpen(F)) {
      const opts = [[1, 'Tomorrow'], [3, 'In 3 days'], [7, 'In a week']];
      extra = '<div class="field"><label for="f-fu">Next follow-up call</label><input class="input" id="f-fu" type="date" data-field="followUpDate" value="' + esc(F.followUpDate) + '">' +
        '<div class="chips" style="margin-top:8px">' + opts.map(o => '<button type="button" class="chip ' + (F.followUpDate === addDays(S.data.today, o[0]) ? 'on' : '') + '" data-act="fu" data-days="' + o[0] + '">' + o[1] + '</button>').join('') + '</div></div>';
    } else if (F.status === 'Lost') {
      extra = '<div class="field" id="fld-lostReason"><label for="f-lost">Why was the customer lost? <span class="req">*</span></label>' +
        '<div class="chips" style="margin-bottom:8px">' + LOST_REASONS.map(x => '<button type="button" class="chip ' + (F.lostReason === x ? 'on' : '') + '" data-act="set" data-field="lostReason" data-value="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>' +
        '<input class="input" id="f-lost" data-field="lostReason" value="' + esc(F.lostReason) + '" placeholder="Or type a reason">' + fieldErr('lostReason') + '</div>';
    } else if (F.status === 'Booked') {
      extra = '<div class="hint">A booking needs a date, slot, hall and guest count. The slot will be blocked for others.</div>';
    }
    $('#f-stage-extra').innerHTML = extra;
    const btn = $('#save-btn');
    if (btn) btn.innerHTML = icon('check') + (F.status === 'Booked' ? 'Save booking' : F.id ? 'Save changes' : 'Save enquiry');
  }
  if (!which || which === 'slot') $('#cg-slot').innerHTML = segSlot();
  ['source', 'eventType'].forEach(k => { if (!which || which === k) $('#cg-' + k).innerHTML = chipGroup(k, S.data.lists[k === 'source' ? 'sources' : 'eventTypes']); });
  if (!which || ['hall', 'eventDate', 'slot', 'guests', 'status'].indexOf(which) !== -1) renderHalls();
  if (!which || ['guests', 'ratePerPlate', 'totalAmount'].indexOf(which) !== -1) renderCalc();
}
function renderHalls() {
  const F = S.form, ready = F.eventDate && F.slot;
  $('#hall-hint').textContent = ready ? 'Availability for ' + fmtMed(F.eventDate) + ', ' + F.slot.toLowerCase() : 'Pick a date and slot to see which halls are free.';
  const list = halls();
  if (F.hall && list.indexOf(F.hall) === -1) list.push(F.hall);
  $('#hall-grid').innerHTML = list.map(h => {
    let cls = '', note = ready ? 'Free' : '';
    if (ready) {
      const s = slotInfo(h, F.eventDate, F.slot, F.id);
      if (s.booked) { cls = 'taken'; note = 'Booked · ' + s.booked.customerName; }
      else if (s.interest.length) { cls = 'interest'; note = 'Free · ' + s.interest.length + ' enquir' + (s.interest.length > 1 ? 'ies' : 'y'); }
      else cls = 'free';
    }
    const cap = hallCap(h);
    if (cap && Number(F.guests) > cap) note += (note ? ' · ' : '') + 'max ' + cap;
    return '<button type="button" class="hall ' + cls + (F.hall === h ? ' on' : '') + '" data-act="set" data-field="hall" data-value="' + esc(h) + '"><b>' + esc(h) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : '') + '</button>';
  }).join('');
}
function renderCalc() {
  const F = S.form, g = Number(F.guests), r = Number(F.ratePerPlate);
  $('#calc').innerHTML = g && r ? '<div class="calc"><span>' + g.toLocaleString('en-IN') + ' guests × ' + money(r) + (F._totalTouched ? ' <span class="muted">(total edited)</span>' : '') + '</span><b>' + money(g * r) + '</b></div>' : '';
}
function onFormInput(el) {
  const k = el.dataset.field, F = S.form;
  F[k] = el.value;
  if (S.errors[k]) { S.errors[k] = ''; const e = $('#err-' + k); if (e) e.textContent = ''; const f = $('#fld-' + k); if (f) f.classList.remove('has-err'); }
  if (k === 'totalAmount') F._totalTouched = el.value !== '';
  if ((k === 'guests' || k === 'ratePerPlate') && !F._totalTouched) {
    const g = Number(F.guests), r = Number(F.ratePerPlate);
    F.totalAmount = g && r ? String(g * r) : '';
    const t = $('#f-total'); if (t) t.value = F.totalAmount;
  }
  if (k === 'followUpDate') refreshForm('status');
  else if (['eventDate', 'guests', 'ratePerPlate', 'totalAmount'].indexOf(k) !== -1) refreshForm(k);
}
function validateForm() {
  const F = S.form, e = {};
  if (!F.customerName.trim()) e.customerName = 'Enter the customer name.';
  const digits = cleanPhone(F.phone).replace(/^\+/, '');
  if (!/^\d{10,13}$/.test(digits)) e.phone = 'Enter a 10 digit mobile number.';
  if (F.status === 'Booked' || F.status === 'Completed') {
    if (!F.eventDate) e.eventDate = 'Needed for a booking.';
    if (!F.slot) e.slot = 'Choose morning or evening.';
    if (!F.hall) e.hall = 'Choose a hall.';
    if (!Number(F.guests)) e.guests = 'Needed for a booking.';
    if (F.hall && F.eventDate && F.slot) {
      const s = slotInfo(F.hall, F.eventDate, F.slot, F.id);
      if (s.booked) e.hall = F.hall + ' is already booked for ' + s.booked.customerName + ' on this slot.';
    }
  }
  if (F.status === 'Lost' && !F.lostReason.trim()) e.lostReason = 'Pick or type a reason.';
  return e;
}
async function saveForm(btn) {
  const errs = validateForm();
  S.errors = errs;
  document.querySelectorAll('.has-err').forEach(x => x.classList.remove('has-err'));
  Object.keys(errs).forEach(k => { const el = $('#err-' + k); if (el) el.textContent = errs[k]; const f = $('#fld-' + k); if (f) f.classList.add('has-err'); });
  const first = Object.keys(errs)[0];
  if (first) {
    const f = $('#fld-' + first) || $('#err-' + first);
    if (f) f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Please check the highlighted fields.', { bad: true });
    return;
  }
  const F = S.form, payload = {};
  RECORD_KEYS.forEach(k => { payload[k] = typeof F[k] === 'string' ? F[k].trim() : F[k]; });
  if (F.id) { payload.id = F.id; payload.updatedAt = F.updatedAt; }
  try {
    const saved = await mutate('apiSaveRecord', payload, btn);
    S.route = { view: 'detail', id: saved.id, from: { view: 'bookings' } };
    Hist.push(S.route);
    render(); window.scrollTo(0, 0);
    const msg = msgTemplates(byId(saved.id))[0];
    toast((saved.status === 'Booked' ? 'Booking saved' : 'Saved') + ' · ' + saved.id, msg ? { action: msg.label === 'Booking confirmation' ? 'Send confirmation' : 'Send on WhatsApp', href: msg.href } : {});
  } catch (e) { /* toast already shown */ }
}

/* =================================================================== detail */

function msgTemplates(r) {
  if (!r) return [];
  const paid = paidFor(r.id), bal = balanceFor(r);
  const when = fmtLong(r.eventDate) + (r.slot ? ' (' + r.slot + ')' : '');
  const out = [];
  const add = (label, text) => out.push({ label, text, href: waLink(r.phone, text) });
  if (isOpen(r)) add('Thank you for your enquiry', 'Namaste ' + r.customerName + ' ji,\nThank you for your enquiry' + (r.eventType ? ' for your ' + r.eventType : '') + (r.hall ? ' at ' + r.hall : '') +
    '. We would be happy to host you. Please let us know a convenient time to visit the hall and for food tasting.');
  if (isBlocking(r)) add('Booking confirmation', 'Namaste ' + r.customerName + ' ji,\nYour booking is confirmed.\n\nBooking ID: ' + r.id + '\nOccasion: ' + (r.eventType || '-') + '\nVenue: ' + r.hall +
    '\nDate: ' + when + '\nGuests: ' + r.guests + '\nTotal: ' + money(r.totalAmount) + '\nPaid: ' + money(paid) + '\nBalance: ' + money(bal) + '\n\nThank you!');
  if (paid > 0) add('Payment receipt', 'Namaste ' + r.customerName + ' ji,\nWe have received ' + money(paid) + ' in total for booking ' + r.id + ' (' + when + ').' + (bal !== null ? '\nBalance remaining: ' + money(bal) : '') + '\nThank you!');
  if (r.status === 'Booked' && bal > 0) add('Balance reminder', 'Namaste ' + r.customerName + ' ji,\nA gentle reminder that ' + money(bal) + ' is pending for your event on ' + when + ' at ' + r.hall + '. Thank you!');
  if (r.status === 'Completed') add('Thank you after the event', 'Namaste ' + r.customerName + ' ji,\nThank you for celebrating with us at ' + r.hall + '. We hope you and your guests enjoyed it. A short review on Google would mean a lot to us!');
  return out;
}

function viewDetail() {
  const r = byId(S.route.id);
  if (!r) return '<div class="card">' + emptyState('alert', 'Record not found', 'It may have been removed. Please refresh.', '<button class="btn btn-soft btn-sm" data-act="nav" data-view="bookings">Back to bookings</button>') + '</div>';
  const pays = paymentsFor(r.id).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const paid = paidFor(r.id), bal = balanceFor(r), total = Number(r.totalAmount) || 0;
  const today = S.data.today;

  // hero
  const facts = [
    [icon('calendar', 'sm'), r.eventDate ? fmtLong(r.eventDate) + ' <span class="muted">· ' + rel(r.eventDate) + '</span>' : '<span class="muted">Date not set</span>'],
    [icon('pin', 'sm'), r.hall ? esc(r.hall) + (r.slot ? ' <span class="muted">· ' + esc(r.slot) + '</span>' : '') : '<span class="muted">Hall not chosen</span>'],
    [icon('users', 'sm'), r.guests ? esc(Number(r.guests).toLocaleString('en-IN')) + ' guests' : '<span class="muted">Guest count not set</span>']
  ];
  const hero = '<div class="card hero"><div class="hero-top">' + dateTile(r) + '<div style="flex:1;min-width:0"><h2>' + esc(r.customerName) + '</h2>' +
    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' + pill(r.status) + '<span class="muted small">' + esc([r.eventType, r.id].filter(Boolean).join(' · ')) + '</span></div></div></div>' +
    '<div class="facts">' + facts.map(f => '<div class="fact">' + f[0] + '<span>' + f[1] + '</span></div>').join('') + '</div>' +
    '<div class="actions"><a class="btn btn-secondary" href="' + esc(telLink(r.phone)) + '">' + icon('phone') + 'Call</a>' +
    '<a class="btn btn-secondary" href="' + esc(waLink(r.phone)) + '" target="_blank" rel="noopener">' + icon('chat') + 'WhatsApp</a>' +
    '<button class="btn btn-secondary" data-act="edit" data-id="' + esc(r.id) + '">' + icon('edit') + 'Edit</button></div></div>';

  // progress + next steps
  const flow = ['Enquiry', 'Visit Scheduled', 'Tasting Scheduled', 'Booked', 'Completed'];
  const short = ['Enquiry', 'Visit', 'Tasting', 'Booked', 'Done'];
  const ci = flow.indexOf(r.status);
  let stage = '';
  if (ci !== -1) stage = '<div class="steps">' + flow.map((s, i) => '<div class="step ' + (i < ci ? 'done' : i === ci ? 'cur' : '') + '"><i></i>' + short[i] + '</div>').join('') + '</div>';
  else if (r.status === 'Lost') stage = '<div class="banner banner-bad">' + icon('x', 'sm') + '<span><b>Lost.</b> ' + esc(r.lostReason || 'No reason noted') + '</span></div><div style="height:12px"></div>';
  else stage = '<div class="banner banner-warn">' + icon('alert', 'sm') + '<span><b>Booking cancelled.</b> The slot is free for others.</span></div><div style="height:12px"></div>';
  let alertHtml = '';
  if (r.status === 'Booked' && r.eventDate && r.eventDate < today) alertHtml = '<div class="banner banner-info" style="margin-bottom:12px">' + icon('alert', 'sm') + '<span>This event date has passed. Mark it as done once the balance is settled.</span></div>';
  const next = (NEXT[r.status] || []).map(s => {
    const cls = s === 'Booked' || s === 'Completed' ? 'btn-ok' : s === 'Lost' || s === 'Cancelled' ? 'btn-danger' : 'btn-soft';
    return '<button class="btn btn-sm ' + cls + '" data-act="move" data-status="' + esc(s) + '">' + esc(NEXT_LABEL[s]) + '</button>';
  }).join('');
  let follow = '';
  if (isOpen(r)) {
    const n = r.followUpDate ? diffDays(r.followUpDate) : null;
    const tag = n === null ? '<span class="tag tag-warn">Not set</span>' : n < 0 ? '<span class="tag tag-bad">' + (-n) + 'd overdue</span>' : n === 0 ? '<span class="tag tag-warn">Today</span>' : '<span class="tag tag-ok">' + rel(r.followUpDate) + '</span>';
    follow = '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="lbl" style="margin:0">Next follow-up call</div><div class="small muted">' +
      (r.followUpDate ? fmtLong(r.followUpDate) : 'No date set') + '</div></div>' + tag + '</div>' +
      '<div class="chips" style="margin-top:10px"><span class="small muted" style="align-self:center">Called? Remind me</span>' +
      [[1, 'Tomorrow'], [3, 'In 3 days'], [7, 'In a week']].map(o => '<button class="chip" data-act="follow" data-days="' + o[0] + '">' + o[1] + '</button>').join('') + '</div></div>';
  }
  const stageCard = '<div class="card card-pad"><div class="section-h" style="margin:0 0 12px"><h2>Progress</h2></div>' + stage + alertHtml + (next ? '<div class="next-btns">' + next + '</div>' : '<div class="small muted">No further steps. This event is complete.</div>') + follow + '</div>';

  // payments
  let payCard = '<div class="card card-pad"><div class="section-h" style="margin:0 0 10px"><h2>Payments</h2>' +
    (r.status !== 'Lost' ? '<button class="btn btn-primary btn-sm" data-act="pay">' + icon('plus', 'sm') + 'Record payment</button>' : '') + '</div>';
  if (total) {
    const pct = Math.max(0, Math.min(100, paid / total * 100));
    payCard += '<div class="money-big"><div><div class="small muted">Balance</div><b style="color:' + (bal > 0 ? 'var(--bad)' : 'var(--ok)') + '">' + money(Math.max(bal, 0)) + '</b></div>' +
      (bal <= 0 ? '<span class="tag tag-ok">Fully paid</span>' : '<span class="small muted">' + Math.round(pct) + '% paid</span>') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="split"><span class="muted">Paid <b style="color:var(--ink)">' + money(paid) + '</b></span><span class="muted">Total <b style="color:var(--ink)">' + money(total) + '</b></span></div>';
  } else {
    payCard += '<div class="small muted">' + (paid ? 'Received ' + money(paid) + '. ' : '') + 'Add the rate per plate or total amount to track the balance.</div>';
  }
  payCard += pays.length ? '<div class="card list" style="margin-top:14px;box-shadow:none">' + pays.map(p =>
    '<div class="row" style="cursor:default"><div class="avatar ic-ok">' + icon('rupee', 'sm') + '</div><div class="body"><div class="title">' + money(p.amount) + '</div><div class="meta">' + esc([p.mode, p.reference].filter(Boolean).join(' · ')) + '</div></div>' +
    '<div class="end"><span class="small muted">' + fmtMed(p.date) + '</span></div></div>').join('') + '</div>' : '';
  payCard += '</div>';

  // messages
  const msgs = msgTemplates(r);
  const msgCard = msgs.length ? '<div class="card list"><div class="section-h" style="margin:0;padding:14px 14px 4px"><h2>Send on WhatsApp</h2></div>' + msgs.map(m =>

    ['Notes', esc(r.notes).replace(/\n/g, '<br>')], ['Added', esc([ts(r.createdAt), r.createdBy].filter(Boolean).join(' · '))], ['Last change', esc([ts(r.updatedAt), r.updatedBy].filter(Boolean).join(' · '))]];
  const details = '<div class="card card-pad"><div class="section-h" style="margin:0 0 12px"><h2>Details</h2><button class="link" data-act="edit" data-id="' + esc(r.id) + '">Edit</button></div><dl class="kv">' +
    kv.map(x => '<dt>' + x[0] + '</dt><dd>' + (x[1] || '<span class="muted">-</span>') + '</dd>').join('') + '</dl></div>';

  return '<div class="grid-2"><div>' + hero + stageCard + kitchenCard(r) + '</div><div>' + payCard + (msgCard ? '<div style="height:14px"></div>' + msgCard : '') + '<div style="height:14px"></div>' + details + '</div></div>';

async function moveStatus(btn, status) {
  const r = byId(S.route.id);
  if (status === 'Lost') return lostSheet(r);
  if (status === 'Cancelled') {
    return openSheet('<h3>Cancel this booking?</h3><p class="sub">' + esc(r.hall) + ' on ' + fmtLong(r.eventDate) + ' (' + esc(r.slot) + ') will become free for other customers. Payments stay on record.</p>' +
      '<div class="btns"><button class="btn btn-secondary" data-act="close-sheet">Keep booking</button><button class="btn btn-danger" data-act="confirm-cancel">Cancel booking</button></div>');
  }
  if (status === 'Booked') {
    const missing = !r.hall || !r.eventDate || !r.slot || !Number(r.guests);
    if (missing) {
      S.prefill = { status: 'Booked' };
      go('form', r.id);
      toast('Add the date, slot, hall and guests to confirm the booking.');
      return;
    }
    const s = slotInfo(r.hall, r.eventDate, r.slot, r.id);
    if (s.booked) return toast(r.hall + ' is already booked for ' + s.booked.customerName + ' on this slot.', { bad: true });
  }
  try {
    await mutate('apiSaveRecord', { id: r.id, updatedAt: r.updatedAt, status: status, lostReason: status === 'Enquiry' ? '' : r.lostReason }, btn);
    const m = status === 'Booked' ? msgTemplates(byId(r.id)).find(x => x.label === 'Booking confirmation') : null;
    toast('Moved to ' + status, m ? { action: 'Send confirmation', href: m.href } : {});
  } catch (e) { /* shown */ }
}
function lostSheet(r) {
  S.lostReason = '';
  openSheet('<h3>Mark as lost</h3><p class="sub">Knowing why helps improve pricing and follow-ups.</p>' +
    '<div class="chips" id="lost-chips" style="margin-top:12px">' + LOST_REASONS.map(x => '<button class="chip" data-act="lost-pick" data-value="' + esc(x) + '">' + esc(x) + '</button>').join('') + '</div>' +
    '<div class="field"><label for="lost-text">Reason</label><input class="input" id="lost-text" placeholder="Pick above or type here"></div>' +
    '<div class="btns"><button class="btn btn-secondary" data-act="close-sheet">Back</button><button class="btn btn-danger" data-act="confirm-lost">Mark as lost</button></div>');
}

function paySheet() {
  const r = byId(S.route.id), bal = balanceFor(r);
  const quick = [];
  if (bal > 0) { quick.push([bal, 'Full balance']); if (bal >= 2000) quick.push([Math.round(bal / 2 / 100) * 100, 'Half']); }
  [25000, 50000, 100000].forEach(v => { if (!bal || v < bal) quick.push([v, moneyShort(v)]); });
  openSheet('<h3>Record payment</h3><p class="sub">' + esc(r.customerName) + (bal !== null ? ' · Balance ' + money(Math.max(bal, 0)) : '') + '</p>' +

/* =================================================================== kitchen: helpers */

const COUNT_UNITS = ['piece', 'dozen', 'packet', 'box', 'bundle'];
function kitchenFor(id) { return (S.data.kitchen || []).find(k => k.recordId === id); }
function dishById(id) { return (S.data.dishes || []).find(x => x.id === id); }
function ingById(id) { return (S.data.ingredients || []).find(x => x.id === id); }
function supById(id) { return (S.data.suppliers || []).find(x => x.id === id); }
function recipeFor(dishId) { return S.recipeIdx[dishId] || []; }
function activeDishes() { return (S.data.dishes || []).filter(x => x.active !== 'No'); }
function activeIngredients() { return (S.data.ingredients || []).filter(x => x.active !== 'No'); }
function catHi(en) { const c = S.data.lists.dishCategories.find(x => x[0] === en); return c ? c[1] : en; }
function catOrder(en) { const i = S.data.lists.dishCategories.findIndex(x => x[0] === en); return i === -1 ? 99 : i; }
function ingLabel(i) { return i ? i.name + (i.nameEn && i.nameEn !== i.name ? ' (' + i.nameEn + ')' : '') : 'Unknown item'; }
function fmtQty(n) { return (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 3 }); }

/** Ingredient totals for a menu: sum of (qty per 100 guests x guests / 100). */
function computeItems(dishIds, guests) {
  const m = {}, g = Number(guests) || 0;
  dishIds.forEach(id => recipeFor(id).forEach(l => { m[l.ingredientId] = (m[l.ingredientId] || 0) + Number(l.qtyPer100) * g / 100; }));
  Object.keys(m).forEach(k => { m[k] = Math.round(m[k] * 1000) / 1000; });
  return m;
}
/** Rounds a calculated quantity up to a sensible buying amount. Devji bhai can still change it. */
function suggestQty(calc, unit) {
  if (!(calc > 0)) return 0;
  const step = COUNT_UNITS.indexOf(unit) !== -1 ? 1 : (unit === 'gram' || unit === 'ml') ? 50 : calc >= 10 ? 1 : calc >= 2 ? 0.5 : 0.1;
  return Math.round(Math.ceil(calc / step - 1e-9) * step * 1000) / 1000;
}
function kitchenStatus(r) {
  const k = kitchenFor(r.id), days = r.eventDate ? diffDays(r.eventDate) : 999, urgent = days <= 6;
  if (!k || !k.dishIds.length) return { key: 'nomenu', label: 'Menu not set', tag: urgent ? 'bad' : 'warn' };
  if (k.qtyStatus === 'Approved' && Number(k.guestsUsed) === Number(r.guests)) return { key: 'ready', label: 'Approved', tag: 'ok' };
  if (k.qtyStatus === 'Approved' || k.qtyStatus === 'Recheck') return { key: 'recheck', label: 'Re-check quantities', tag: 'bad' };
  if (k.menuStatus !== 'Final') return { key: 'draft', label: 'Menu draft', tag: urgent ? 'bad' : 'warn' };
  return { key: 'qty', label: 'Quantities to approve', tag: urgent ? 'bad' : 'warn' };
}
function ksTag(st) { return '<span class="tag tag-' + st.tag + '">' + esc(st.label) + '</span>'; }
function groupedMenu(dishIds) {
  const groups = {};
  dishIds.map(dishById).filter(Boolean).forEach(d => { (groups[d.category] = groups[d.category] || []).push(d); });
  return Object.keys(groups).sort((a, b) => catOrder(a) - catOrder(b)).map(c => ({ cat: c, dishes: groups[c] }));
}
function eventLine(r) { return [r.eventType, fmtLong(r.eventDate) + (r.slot ? ' (' + r.slot + ')' : ''), r.hall, r.guests ? r.guests + ' guests' : ''].filter(Boolean).join(' · '); }
function eventCard(r, extra) {

    '<div class="small muted">' + esc(eventLine(r)) + '</div></div></div>' + (extra || '') + '</div>';

function ingSuggest(q, exclude, act, ctx) {
  q = String(q || '').trim().toLowerCase();
  if (!q) return '';
  const list = activeIngredients().filter(i => exclude.indexOf(i.id) === -1 && (i.name + ' ' + (i.nameEn || '')).toLowerCase().indexOf(q) !== -1).slice(0, 8);

const TR = { timer: null, seq: 0 };
const TR_IDS = { dish: { en: 'df-en', hi: 'df-name', st: 'df-name-st' }, ing: { en: 'ing-en', hi: 'ing-name', st: 'ing-name-st' } };
function trForm(ctx) { return ctx === 'dish' ? S.df : S.ingForm; }
function trField(id, dfKey, value, ph, ctx) {
  return '<div class="field"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><label for="' + id + '">Name in Hindi <span class="req">*</span></label>' +
    '<button type="button" class="link" data-act="translate" data-for="' + ctx + '">' + icon('refresh', 'sm') + ' Translate</button></div>' +
    '<input class="input hi" id="' + id + '"' + (dfKey ? ' data-df="' + dfKey + '"' : '') + ' value="' + esc(value) + '" placeholder="' + ph + '" autocomplete="off">' +
    '<div class="hint" id="' + id + '-st">Filled in automatically from the English name. Check the spelling.</div></div>';

function trStatus(ctx, text, bad) { const el = $('#' + TR_IDS[ctx].st); if (el) { el.textContent = text; el.style.color = bad ? 'var(--bad)' : ''; } }
function scheduleTranslate(ctx) {
  clearTimeout(TR.timer);
  TR.timer = setTimeout(() => translateNow(ctx), 650);
}
async function translateNow(ctx) {
  clearTimeout(TR.timer);
  const F = trForm(ctx), ids = TR_IDS[ctx], enEl = $('#' + ids.en);
  const en = (enEl ? enEl.value : F.nameEn || '').trim();
  if (!F || !en) return;
  const seq = ++TR.seq;
  trStatus(ctx, 'Translating...');
  try {
    const hi = await call('apiTranslate', en);
    const cur = $('#' + ids.en);
    if (seq !== TR.seq || !cur || cur.value.trim() !== en || trForm(ctx) !== F) return;
    if (!hi) { trStatus(ctx, 'No translation found. Please type the Hindi name.', true); return; }
    F.name = hi; F.hiTouched = false;
    const hiEl = $('#' + ids.hi); if (hiEl) hiEl.value = hi;
    trStatus(ctx, 'Translated automatically. Change it if the spelling is not right.');
  } catch (e) {
    if (seq === TR.seq) trStatus(ctx, e.message, true);
  }
}

  });
  (k.items || []).filter(it => it.extra && calc[it.ingredientId] === undefined).forEach(it => items.push({ ingredientId: it.ingredientId, calc: 0, qty: String(it.qty), extra: true, was: null }));
  S.ks = { recordId: r.id, items, notes: k.kitchenNotes || '', updatedAt: k.updatedAt, dirty: !k.items || !k.items.length, q: '', checked: {}, open: {}, editing: false, menuOpen: false };

function sheetGroups() {

  S.ks.items.forEach((it, i) => {
    const ing = ingById(it.ingredientId), sid = ing && ing.supplierId && supById(ing.supplierId) ? ing.supplierId : '';
    (groups[sid] = groups[sid] || []).push({ it, i, ing });

  sheetGroups().forEach(g => {

  });
  if (S.ks.notes) t += '\nNotes: ' + S.ks.notes;

function itemGroupKey(it) { const ing = ingById(it.ingredientId); return ing && ing.supplierId && supById(ing.supplierId) ? ing.supplierId : ''; }
/** How a quantity compares with the recipe. null = matches the suggestion. */
function itemFlag(it, ing) {
  const unit = ing ? ing.unit : '';
  if (it.qty === '' || isNaN(Number(it.qty))) return { lvl: 'bad', text: 'Enter a quantity (0 if not needed)' };
  const q = Number(it.qty);
  if (it.extra) return q > 0 ? null : { lvl: 'warn', text: 'Extra item set to 0' };
  const sug = suggestQty(it.calc, unit);
  if (Math.abs(q - sug) < 0.0005) return null;
  if (it.calc > 0 && q === 0) return { lvl: 'bad', text: 'Set to 0, but the recipe needs ' + fmtQty(it.calc) + ' ' + unit };
  const ratio = it.calc > 0 ? q / it.calc : 1;
  if (ratio > 2) return { lvl: 'bad', text: (Math.round(ratio * 10) / 10) + ' times the recipe. Typing mistake?' };
  if (ratio < 0.5) return { lvl: 'bad', text: 'Less than half of what the recipe needs' };
  const pct = Math.round((ratio - 1) * 100);
  if (Math.abs(pct) > 25) return { lvl: 'warn', text: (pct > 0 ? '+' : '') + pct + '% compared with the recipe' };
  return { lvl: 'info', text: 'Changed by you (suggested ' + fmtQty(sug) + ' ' + unit + ')' };
}
function whyRows(it, r, k) {
  const g = Number(r.guests) || 0;

function approveSheet() {

  if (p.done < p.total) {

async function saveSheet(btn, approve) {
  const K = S.ks;
  if (K.items.some(i => i.qty === '' || !(Number(i.qty) >= 0))) return toast('Enter a quantity for every item (0 if not needed).', { bad: true });
  try {
    await mutate('apiSaveQuantities', { recordId: K.recordId, updatedAt: K.updatedAt, approve: !!approve, kitchenNotes: ($('#ks-notes') || { value: K.notes }).value.trim(),
      items: K.items.map(i => ({ ingredientId: i.ingredientId, calc: i.calc, qty: Number(i.qty), extra: i.extra })) }, btn);
    const menuOpen = K.menuOpen;
    closeSheet(); startSheet(); S.ks.menuOpen = menuOpen; render(); window.scrollTo(0, 0);
    toast(approve ? 'Approved and locked. Supplier orders are ready.' : 'Draft saved. It still needs approval.');
  } catch (e) { /* shown */ }
}

  } else {

    body = '<div class="hi" style="font-size:14.5px">' + esc(names.slice(0, 6).join(' · ')) + (names.length > 6 ? ' <span class="muted">+' + (names.length - 6) + ' more</span>' : '') + '</div>' +

    ING.forEach(x => { ing[x[1]] = api.apiSaveIngredient({ name: x[0], nameEn: x[1], unit: x[2], category: x[3], supplierId: x[4] >= 0 ? sup[x[4]] : '' }).id; });
    const DISH = [
      ['मसाला छाछ', 'Masala Chaas', 'Welcome drink', [['Curd', 8], ['Cumin', 0.05]]],
      ['पनीर बटर मसाला', 'Paneer Butter Masala', 'Main course', [['Paneer', 8], ['Butter', 1], ['Fresh cream', 1], ['Tomato', 6], ['Onion', 3], ['Cashew', 0.5], ['Garam masala', 0.1], ['Oil', 1]]],

      ['दाल मखनी', 'Dal Makhani', 'Dal', [['Urad dal', 3], ['Rajma', 0.5], ['Butter', 1], ['Fresh cream', 1], ['Tomato', 3]]],
      ['जीरा राइस', 'Jeera Rice', 'Rice', [['Basmati rice', 6], ['Ghee', 0.5], ['Cumin', 0.1]]],

      ['रसमलाई', 'Rasmalai', 'Dessert', []]
    ];
    const dish = {};
    DISH.forEach(x => { dish[x[1]] = api.apiSaveDish({ name: x[0], nameEn: x[1], category: x[2], recipe: x[3].map(l => ({ ingredientId: ing[l[0]], qtyPer100: l[1] })) }).dish.id; });
    const recs = load().records, byName = n => recs.find(r => r.customerName === n);
    const menu = (name, dishes, status) => api.apiSaveMenu({ recordId: byName(name).id, dishIds: dishes.map(d => dish[d]), menuStatus: status });
    menu('Ramesh Sharma', ['Masala Chaas', 'Paneer Butter Masala', 'Dal Makhani', 'Jeera Rice', 'Butter Naan', 'Green Salad', 'Boondi Raita', 'Gulab Jamun'], 'Final');
    const mehta = menu('Mehta Family', ['Mix Veg', 'Dal Makhani', 'Jeera Rice', 'Tandoori Roti', 'Gulab Jamun'], 'Final');
    menu('Neha Joshi', ['Paneer Butter Masala', 'Rasmalai'], 'Draft');
    const db = load(), guests = byName('Mehta Family').guests, totals = {};
    mehta.dishIds.forEach(id => db.recipes.filter(r => r.dishId === id).forEach(l => { totals[l.ingredientId] = (totals[l.ingredientId] || 0) + l.qtyPer100 * guests / 100; }));
    const items = Object.keys(totals).map(id => ({ ingredientId: id, calc: totals[id], qty: Math.ceil(totals[id] * 2) / 2 }));
    items.push({ ingredientId: ing['Gas cylinder'], calc: 0, qty: 4, extra: true });
    api.apiSaveQuantities({ recordId: byName('Mehta Family').id, items, approve: true, kitchenNotes: 'Deliver by 10 am on the event day.' });

  return {
    call: (fn, arg) => new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(api[fn](arg)))); } catch (e) { rej(e); } }, 120)),
    seed, reset: () => store(EMPTY())
  };
